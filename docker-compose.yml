services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SQL_SA_PASSWORD}"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_SA_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=AuctionPlatformGe;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY}"
      Payze__TestMode: "${PAYZE_TEST_MODE:-true}"
      Payze__ApiKey: "${PAYZE_API_KEY}"
      Payze__ApiSecret: "${PAYZE_API_SECRET}"
      Payze__WebhookSecret: "${PAYZE_WEBHOOK_SECRET}"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.angular
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  sqldata:
